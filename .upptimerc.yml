owner: gitkotodama
repo: kotodama-status
user-agent: kotodama-status

sites:
  - name: Web pública
    url: https://kotodama.dev/
    maxResponseTime: 5000
  - name: PHP
    url: https://kotodama.dev/health?service=php
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: SQLite
    url: https://kotodama.dev/health?service=database
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Almacenamiento
    url: https://kotodama.dev/health?service=storage
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

status-website:
  cname: status.kotodama.dev
  name: Estado de Kotodama
  themeUrl: https://status.kotodama.dev/kotodama-status.css
  favicon: https://status.kotodama.dev/favicon.png
  introTitle: ">_ estado de los servicios"
  introMessage: "Monitorización externa de la disponibilidad de Kotodama. Este panel se ejecuta fuera del servidor principal para que siga siendo accesible durante una incidencia."
  navbar:
    - title: estado
      href: /
    - title: kotodama.dev
      href: https://kotodama.dev/
  customBodyHtml: |
    <div class="koto-status-brandbar">
      <div class="koto-status-brandinner">
        <a class="koto-status-brand" href="https://kotodama.dev/">kotodama</a>
        <span class="koto-status-brandsep">//</span>
        <span class="koto-status-brandsection">estado de servicios</span>
      </div>
    </div>
  customFootHtml: |
    <div class="koto-status-external-note">
      <span class="koto-status-prompt">&gt;_</span>
      comprobaciones externas automáticas mediante GitHub Actions
    </div>
  metaTags:
    - name: color-scheme
      content: dark
    - name: theme-color
      content: "#111111"

# Mantener las incidencias breves en el historial público en lugar de
# eliminarlas automáticamente si duran menos de 15 minutos.
skipDeleteIssues: true

i18n:
  activeIncidents: Incidentes activos
  allSystemsOperational: Todos los servicios están operativos
  incidentReport: "Incidente #$NUMBER →"
  activeIncidentSummary: Abierto a las $DATE con $POSTS actualizaciones
  incidentTitle: Detalles del incidente $NUMBER
  incidentDetails: Detalles del incidente
  incidentFixed: Resuelto
  incidentOngoing: En curso
  incidentOpenedAt: Abierto el
  incidentClosedAt: Cerrado el
  incidentViewOnGitHub: Ver en GitHub
  incidentCommentSummary: Publicado el $DATE por $AUTHOR
  incidentBack: ← Volver a todos los incidentes
  pastIncidents: Incidentes anteriores
  pastIncidentsResolved: Resuelto en $MINUTES minutos con $POSTS actualizaciones
  liveStatus: Estado actual
  overallUptime: "Disponibilidad total: $UPTIME"
  overallUptimeTitle: Disponibilidad total
  averageResponseTime: "Tiempo medio de respuesta: $TIME ms"
  averageResponseTimeTitle: Tiempo medio de respuesta
  sevelDayResponseTime: Tiempo de respuesta de 7 días
  responseTimeMs: Tiempo de respuesta (ms)
  up: Operativo
  down: Caído
  degraded: Degradado
  ms: ms
  loading: Cargando
  navGitHub: GitHub
  footer: "Kotodama · estado de los servicios"
  rateLimitExceededTitle: Se ha superado temporalmente el límite de GitHub
  rateLimitExceededIntro: Vuelve a intentarlo dentro de unos minutos.
